name: CI

# Kjører på push og pull request mot main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdownlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: markdownlint-cli
        uses: nosborn/github-action-markdown-cli@v1.1.1
        with:
          files: .
          config_file: ".markdownlint.json"

  hugo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sett opp Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Bygg nettsiden
        run: hugo --minify

      # Første kjøring viser også advarsler, men stopper ikke bygget
      - name: HTML5-validering (med advarsler)
        uses: Cyb3r-Jak3/html5validator-action@master
        with:
          root: public/
          extra: --show-warnings
        continue-on-error: true

      # Andre kjøring er den som avgjør: feil her feller bygget
      - name: HTML5-validering
        uses: Cyb3r-Jak3/html5validator-action@master
        with:
          root: public/
