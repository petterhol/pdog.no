{{ define "main" }}
  {{ .Content }}

  {{ with .Sections.ByWeight }}
  <div class="row row-cols-1 row-cols-md-2 g-3 my-4">
    {{ range . }}
    <div class="col">
      <a class="text-decoration-none text-reset" href="{{ .RelPermalink }}">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">{{ .Title }}</h2>
            <p class="card-text text-body-secondary small mb-0">
              {{ $n := len .RegularPages }}{{ $n }} artikk{{ if eq $n 1 }}el{{ else }}ler{{ end }}
            </p>
          </div>
        </div>
      </a>
    </div>
    {{ end }}
  </div>
  {{ end }}

  {{ with .RegularPages.ByWeight }}
  <div class="list-group my-4">
    {{ range . }}
    <a class="list-group-item list-group-item-action" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  </div>
  {{ end }}
{{ end }}
