<span id="{{ .Get "ident" }}">
<span style="display:none;">{{ .Get "hiddentext" }}</span></span>

{{ .Inner }} <button class="btn badge text-bg-light" onclick="copyToClipboard('#{{ .Get "ident" }}')">Kopier</button>

<script>
function copyToClipboard(element) {
  var el = document.querySelector(element);
  if (el) { navigator.clipboard.writeText(el.textContent.trim()); }
}
</script>
