<text id="designmodeon">
<div style="display:none;">document.designMode = "on"</div></text>

<code>document.designMode = "on"</code> <button class="btn badge text-bg-light" onclick="copyToClipboard('#designmodeon')">Kopier</button>

<script>
function copyToClipboard(element) {
  var el = document.querySelector(element);
  if (el) { navigator.clipboard.writeText(el.textContent.trim()); }
}
</script>
