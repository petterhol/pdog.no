<div class="container mt-5">
  <div class="card position-relative">
    <div class="badge text-bg-{{ .Get "badgeType" }} position-absolute" style="top: 10px; right: 10px;">{{ .Get "badgeText" }}</div>
    <div class="card-body">
      <h5 class="card-title">{{ .Get "title" }}</h5>
      <p class="card-text">{{ .Inner | markdownify }}</p>
    </div>
  </div>
</div>

<script>
// Script to change arrow direction on collapse
document.addEventListener('DOMContentLoaded', function () {
  var c = document.getElementById('collapseContent');
  var i = document.getElementById('collapseIcon');
  if (!c || !i) { return; }
  c.addEventListener('show.bs.collapse', function () {
    i.classList.remove('fa-arrow-right'); i.classList.add('fa-arrow-down');
  });
  c.addEventListener('hide.bs.collapse', function () {
    i.classList.remove('fa-arrow-down'); i.classList.add('fa-arrow-right');
  });
});
</script>
