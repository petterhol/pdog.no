{{ define "main" }}
  {{ with .Params.subtitle }}
    <span class="subtitle">{{ . }}</span>
  {{ end }}
  {{ .Content }}

  {{ with .Site.Sections.ByWeight }}
  <div class="row row-cols-1 row-cols-md-2 g-3 my-4">
    {{ range . }}
    <div class="col">
      <a class="text-decoration-none text-reset" href="{{ .RelPermalink }}">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">{{ .Title }}</h2>
            <p class="card-text text-body-secondary small mb-0">{{ .Params.ingress }}</p>
          </div>
        </div>
      </a>
    </div>
    {{ end }}
  </div>
  {{ end }}
{{ end }}
